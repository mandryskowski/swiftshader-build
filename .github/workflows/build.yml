name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target:
          - Linux
          - Windows
          - Darwin
        asan:
          - false
          - true
        include:
          # --- Linux Builds ---
          - target: Linux
            asan: false
            os: ubuntu-latest
            artifact: linux64
            build_script: build.sh
            cmake_args: ""

          - target: Linux
            asan: true
            os: ubuntu-latest
            artifact: linux64-asan
            build_script: build.sh
            cmake_args: "-DCMAKE_C_FLAGS=-fsanitize=address -DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"

          # --- Windows Builds ---
          - target: Windows
            asan: false
            os: windows-latest
            artifact: win64
            build_script: build.ps1
            cmake_args: ""

          - target: Windows
            asan: true
            os: windows-latest
            artifact: win64-asan
            build_script: build.ps1
            cmake_args: "-DCMAKE_C_FLAGS=/fsanitize=address -DCMAKE_CXX_FLAGS=/fsanitize=address"

          # --- MacOS (Darwin) Builds ---
          - target: Darwin
            asan: false
            os: macos-latest
            artifact: macos64
            build_script: build.sh
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSPIRV_WERROR=OFF -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF"

          - target: Darwin
            asan: true
            os: macos-latest
            artifact: macos64-asan
            build_script: build.sh
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSPIRV_WERROR=OFF -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF -DCMAKE_C_FLAGS=-fsanitize=address -DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build

      - name: Install dependencies (MacOS)
        if: matrix.target == 'Darwin'
        run: |
          brew install ninja

      - name: Build swiftshader
        run: ./${{ matrix.build_script }} ${{ matrix.cmake_args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftshader-${{ matrix.artifact }}
          path: build/${{ matrix.target }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create git tag
        id: create-git-tag
        run: |
          tag="autobuild-$(date -u '+%Y-%m-%d-%H-%M')"
          git tag $tag
          git push origin $tag
          echo "TAG=$tag" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git --git-dir swiftshader/.git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Prepare artifacts
        run: |
          # Dynamically package all artifact directories avoiding the need to hard-code targets
          for dir in swiftshader-*/; do
            # Strip the trailing slash
            dir="${dir%/}"
            echo "${{ steps.create-git-tag.outputs.COMMIT }}" > "$dir/COMMIT"
            tar -czf "$dir.tar.gz" "$dir"
          done

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.create-git-tag.outputs.TAG }} swiftshader-*.tar.gz \
            -n "google/swiftshader@${{ steps.create-git-tag.outputs.COMMIT }}"