name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target:
          - Linux
        asan:
          - false
          - true
        include:
          # --- Linux Builds ---
          - target: Linux
            asan: false
            os: ubuntu-24.04
            artifact: linux64
            cc: gcc
            cxx: g++
            cflags: ""
            ldflags: ""

          - target: Linux
            asan: true
            os: ubuntu-24.04
            artifact: linux64-asan
            cc: clang
            cxx: clang++
            cflags: "-fsanitize=address"
            # -fuse-ld=lld is more robust for ASan
            # -Wl,--undefined-version prevents lld from failing on SwiftShader's generic linker script
            ldflags: "-fsanitize=address -fuse-ld=lld -Wl,--undefined-version"

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Install dependencies (MacOS)
        if: matrix.target == 'Darwin'
        run: |
          brew install ninja

      - name: Build swiftshader (Unix)
        if: matrix.target != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          mkdir -p build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DSWIFTSHADER_BUILD_TESTS=OFF ../swiftshader
          
          # SwiftShader's CMake hardcodes -Wl,--no-undefined, which breaks ASan shared libs.
          # We remove it from the generated ninja file using perl (cross-platform safe).
          if [ "${{ matrix.asan }}" = "true" ]; then
            perl -pi -e 's/-Wl,--no-undefined//g' build.ninja
          fi
          
          # ONLY build the driver! This avoids all failing testing submodules.
          cmake --build . --target vk_swiftshader

      - name: Build swiftshader (Windows)
        if: matrix.target == 'Windows'
        run: |
          New-Item -ItemType Directory -ErrorAction SilentlyContinue build
          Push-Location build
          cmake ../swiftshader -DSWIFTSHADER_BUILD_TESTS=OFF
          # ONLY build the driver!
          cmake --build . --config Release --target vk_swiftshader
          Pop-Location

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftshader-${{ matrix.artifact }}
          path: build/${{ matrix.target }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create git tag
        id: create-git-tag
        run: |
          tag="autobuild-$(date -u '+%Y-%m-%d-%H-%M')"
          git tag $tag
          git push origin $tag
          echo "TAG=$tag" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git --git-dir swiftshader/.git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Prepare artifacts
        run: |
          # Dynamically package all artifact directories
          for dir in swiftshader-*/; do
            dir="${dir%/}"
            echo "${{ steps.create-git-tag.outputs.COMMIT }}" > "$dir/COMMIT"
            tar -czf "$dir.tar.gz" "$dir"
          done

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.create-git-tag.outputs.TAG }} swiftshader-*.tar.gz \
            -n "google/swiftshader@${{ steps.create-git-tag.outputs.COMMIT }}"
